name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests migrations
      - run: pytest -q
      - run: docker compose config
        env:
          DB_PASSWORD: ci-placeholder
          DB_ROOT_PASSWORD: ci-placeholder
          APP_ACCESS_PASSWORD: ci-access-password-123456789
          APP_SESSION_SECRET: ci-session-secret-abcdefghijklmnopqrstuvwxyz
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DB_PASSWORD: ci-placeholder-only
      DB_ROOT_PASSWORD: ci-root-placeholder-only
      APP_PORT: '8096'
      APP_ACCESS_PASSWORD: ci-access-password-123456789
      APP_SESSION_SECRET: ci-session-secret-abcdefghijklmnopqrstuvwxyz
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose and build app images
        run: |
          docker compose config --quiet
          timeout 240 docker compose build app migrate
      - name: Start complete application stack
        run: timeout 180 docker compose up -d --no-build
      - name: Verify HTTP API and page
        run: |
          curl --retry 30 --retry-delay 2 --retry-connrefused --retry-all-errors --fail --silent --show-error http://127.0.0.1:8096/health | grep '"status":"ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8096/api/v1/workspaces)" = "401"
          curl -fsS -c /tmp/mmc-cookies -H 'Content-Type: application/json' \
            -d '{"password":"ci-access-password-123456789"}' http://127.0.0.1:8096/auth/login | grep 'authenticated'
          curl --fail --silent --show-error -b /tmp/mmc-cookies http://127.0.0.1:8096/ | grep 'id="composer"'
          curl --fail --silent --show-error -b /tmp/mmc-cookies http://127.0.0.1:8096/api/v1/workspaces | grep '"workspaces"'
      - name: Show targeted logs on failure
        if: failure()
        run: |
          timeout 20 docker compose ps --all || true
          timeout 20 docker compose logs --tail=80 app migrate db || true
      - name: Stop CI stack safely
        if: always()
        run: timeout 40 docker compose down --remove-orphans || true
